name: Build & Release

# 推送形如 v1.1.0 的 tag 时自动构建并发布 Release
on:
  push:
    tags:
      - "v*"
  # 也支持手动触发：只构建并上传 artifact，不发布 Release
  workflow_dispatch:

permissions:
  contents: write          # 创建 Release / 上传附件需要

# 统一在这里解析版本名，所有步骤共用
env:
  TAG_NAME: ${{ github.ref_name }}

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: 环境信息
        run: |
          python --version
          python -m PyInstaller --version

      - name: 打包 exe（使用仓库内的 spec）
        run: python -m PyInstaller --noconfirm --clean DiskCleaner.spec

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = "dist\DiskCleaner.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "打包产物不存在: $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host ("产物大小: {0:N2} MB" -f ($size / 1MB))
          if ($size -lt 5MB) {
            Write-Error "产物体积异常，疑似打包不完整"
            exit 1
          }

      - name: 重命名产物并生成 SHA256
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "manual-${{ github.run_number }}" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $out = "release\DiskCleaner-$tag.exe"
          Copy-Item "dist\DiskCleaner.exe" $out
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash
          "SHA256 (DiskCleaner-$tag.exe) = $hash" | Out-File "release\SHA256SUMS.txt" -Encoding utf8
          "TAG_NAME=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "标签: $tag"
          Get-Content "release\SHA256SUMS.txt"

      - name: 上传构建产物（任何触发方式都保留一份）
        uses: actions/upload-artifact@v4
        with:
          name: DiskCleaner-${{ env.TAG_NAME }}
          path: release/*
          if-no-files-found: error

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: DiskCleaner ${{ env.TAG_NAME }}
          draft: false
          generate_release_notes: true
          body: |
            ## DiskCleaner ${{ env.TAG_NAME }}

            磁盘垃圾清理小工具 —— 选一个盘，扫描出所有安装包 / 更新包 / 缓存，
            并告诉你每个文件属于哪个软件。

            ### 下载
            下载下面的 **`DiskCleaner-${{ env.TAG_NAME }}.exe`**，双击即可运行
            （免安装、无需 Python）。

            > 首次运行若提示「Windows 已保护你的电脑」，点「更多信息 → 仍要运行」。
            > 文件未做代码签名，可用 `SHA256SUMS.txt` 校验完整性。

            ### 功能
            - 🚀 优先用 **Everything CLI** 索引扫描（C 盘约 15 秒），找不到时自动回退 Python 遍历
            - 🏷️ 识别每个文件属于哪个软件、是安装包 / 更新包 / 缓存，并给出可信度
            - 🟢🟡🔴 三级风险分类，危险项（笔记备份、系统还原点）不可勾选
            - 🧺 默认移到**回收站**，可还原
            - 📤 支持导出 CSV / Markdown / JSON 报告
            - 🌗 明亮 / 深色双主题

            ---
            **完整说明见 [README](https://github.com/${{ github.repository }}#readme)**
          files: |
            release/DiskCleaner-${{ env.TAG_NAME }}.exe
            release/SHA256SUMS.txt
